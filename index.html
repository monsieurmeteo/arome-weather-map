<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modèle AROME HD — Météo-France 1,3 km</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --amfm-bg: #070b14;
            --amfm-surface: rgba(13, 19, 33, 0.92);
            --amfm-border: rgba(255, 255, 255, 0.14);
            --amfm-accent: #00d2ff;
            --amfm-text: #f8fafc;
            --amfm-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--amfm-bg); color: var(--amfm-text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        [data-amfm-app] { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .amfm-viewport { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #070b14; cursor: grab; }
        .amfm-viewport:active { cursor: grabbing; }
        .amfm-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Header Supérieur Comme Avant */
        .amfm-header { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 100; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
        .amfm-card { pointer-events: auto; background: var(--amfm-surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--amfm-border); border-radius: 12px; padding: 8px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 12px; }
        .amfm-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; }
        .amfm-badge { background: linear-gradient(135deg, #0284c7, #00d2ff); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .amfm-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--amfm-border); color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .amfm-btn:hover { background: rgba(0, 210, 255, 0.25); border-color: var(--amfm-accent); }
        .btn-download { background: linear-gradient(135deg, #0284c7, #00d2ff) !important; color: #fff !important; font-weight: 800 !important; }
        .amfm-controls { display: flex; align-items: center; gap: 10px; }
        select { background: rgba(8,12,20,0.95); border: 1px solid var(--amfm-border); color: #fff; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 8px; outline: none; cursor: pointer; }
        select:hover { border-color: var(--amfm-accent); }

        /* Légende */
        .amfm-legend { position: absolute; left: 16px; bottom: 92px; z-index: 100; background: var(--amfm-surface); backdrop-filter: blur(20px); border: 1px solid var(--amfm-border); border-radius: 12px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); min-width: 280px; }
        
        /* Timeline Inférieure */
        .amfm-timeline { position: absolute; bottom: 14px; left: 14px; right: 14px; z-index: 100; background: var(--amfm-surface); backdrop-filter: blur(24px); border: 1px solid var(--amfm-border); border-radius: 16px; padding: 10px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 18px; }
        .amfm-player { display: flex; align-items: center; gap: 8px; }
        .amfm-player button { background: rgba(255,255,255,0.08); border: 1px solid var(--amfm-border); color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
        .amfm-player button:hover { background: #0284c7; border-color: var(--amfm-accent); }
        .amfm-slider-track { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .amfm-info-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
        .amfm-validity { color: var(--amfm-accent); }
        .amfm-lead { background: rgba(0,210,255,0.18); border: 1px solid rgba(0,210,255,0.3); padding: 2px 8px; border-radius: 6px; }
        input[type="range"] { width: 100%; height: 6px; border-radius: 3px; accent-color: var(--amfm-accent); cursor: pointer; }
        
        /* Sonde */
        .amfm-probe { position: fixed; z-index: 1500; pointer-events: none; background: rgba(8,12,20,0.95); border: 1px solid var(--amfm-accent); border-radius: 8px; padding: 6px 10px; display: none; }
        .amfm-probe.active { display: block; }
        .amfm-probe-val { font-size: 16px; font-weight: 800; color: var(--amfm-accent); }
    </style>
</head>
<body>
    <div data-amfm-app
         data-base-url="output"
         data-variable="temperature"
         data-timezone="Europe/Paris"
         data-animation="1">
        
        <!-- Header Supérieur -->
        <header class="amfm-header">
            <div class="amfm-card">
                <div class="amfm-title">
                    <i class="fa-solid fa-bolt" style="color:#00d2ff;"></i>
                    <span>MODÈLE AROME HD</span>
                    <span class="amfm-badge">1,3 km</span>
                </div>
            </div>

            <div class="amfm-card amfm-controls">
                <!-- Sélecteur de Modèle -->
                <select id="select-model" title="Modèle">
                    <option value="arome" selected>🇫🇷 AROME HD (1,3 km)</option>
                    <option value="arpege">🇫🇷 ARPEGE (5 km)</option>
                    <option value="icon">🇩🇪 ICON-EU (7 km)</option>
                    <option value="gfs">🇺🇸 GFS (13 km)</option>
                    <option value="ecmwf">🇪🇺 ECMWF IFS (9 km)</option>
                </select>

                <!-- Sélecteur direct de Calque Météo 100% Opérationnel -->
                <select id="direct-layer-select" title="Paramètre météo">
                    <optgroup label="🌡️ Températures">
                        <option value="temperature" selected>🌡️ Température à 2 m (°C)</option>
                        <option value="temperature_ressentie">❄️ Température ressentie (°C)</option>
                        <option value="point_rosee">💧 Point de rosée (°C)</option>
                        <option value="humidex">🔥 Indice Humidex</option>
                    </optgroup>
                    <optgroup label="🌧️ Précipitations & Pluie">
                        <option value="pluie_1h">🌧️ Pluie horaire (mm/h)</option>
                        <option value="pluie_cumul">📊 Précipitations cumulées (mm)</option>
                        <option value="reflectivite">📡 Réflectivité Radar Doppler (dBZ)</option>
                    </optgroup>
                    <optgroup label="💨 Vent & Tempêtes">
                        <option value="vent">💨 Vent moyen à 10 m (km/h)</option>
                        <option value="rafales">⚡ Rafales maximales (km/h)</option>
                    </optgroup>
                    <optgroup label="⛈️ Orages & Convection">
                        <option value="mucape">⚡ Instabilité convective (MUCAPE J/kg)</option>
                    </optgroup>
                    <optgroup label="❄️ Neige & Hiver">
                        <option value="neige">❄️ Chutes de neige (cm/h)</option>
                        <option value="neige_au_sol">🏔️ Épaisseur neige au sol (cm)</option>
                    </optgroup>
                    <optgroup label="☁️ Nuages & Pression">
                        <option value="humidite">🌫️ Humidité relative (%)</option>
                        <option value="pression">🧭 Pression niveau mer (hPa)</option>
                    </optgroup>
                </select>

                <!-- Sélecteur de Région -->
                <select id="select-region" data-amfm-region-select title="Région">
                    <option value="france">🇫🇷 France Entière</option>
                    <option value="hdf">🏘️ Hauts-de-France</option>
                    <option value="idf">🗼 Île-de-France</option>
                    <option value="ara">⛰️ Auvergne-Rhône-Alpes</option>
                    <option value="paca">☀️ PACA</option>
                    <option value="occitanie">🌞 Occitanie</option>
                    <option value="naq">🌊 Nouvelle-Aquitaine</option>
                    <option value="bretagne">⛵ Bretagne</option>
                    <option value="normandie">🍏 Normandie</option>
                    <option value="grandest">🥨 Grand Est</option>
                    <option value="corse">🏝️ Corse</option>
                </select>

                <!-- Bouton Télécharger Carte HD -->
                <button type="button" class="amfm-btn btn-download" data-amfm-capture title="Télécharger la carte HD">
                    <i class="fa-solid fa-download"></i> Télécharger
                </button>

                <!-- Recadrer -->
                <button type="button" class="amfm-btn" data-amfm-reset title="Recentrer la carte">
                    <i class="fa-solid fa-compress"></i> Recadrer
                </button>
            </div>
        </header>

        <!-- Viewport Cartographique Multi-Canvas -->
        <main class="amfm-viewport" data-amfm-viewport>
            <canvas class="amfm-canvas" data-amfm-weather></canvas>
            <canvas class="amfm-canvas" data-amfm-vectors></canvas>
            <canvas class="amfm-canvas" data-amfm-labels></canvas>
        </main>

        <!-- Sonde de Pixel -->
        <div class="amfm-probe" data-amfm-probe>
            <div class="amfm-probe-val" data-amfm-probe-value>—</div>
            <div style="font-size:10px; color:#94a3b8;" data-amfm-probe-label>Température</div>
        </div>

        <!-- Éléments d'état internes requis par le moteur -->
        <div style="display:none;">
            <span data-amfm-current-layer></span>
            <button data-amfm-menu-toggle></button>
            <button data-amfm-menu-close></button>
            <div data-amfm-layer-menu><div data-amfm-layer-grid></div></div>
            <span data-amfm-run></span>
            <span data-amfm-map-run></span>
            <span data-amfm-generated></span>
            <span data-amfm-stale></span>
            <span data-amfm-map-title></span>
            <span data-amfm-map-date></span>
            <span data-amfm-loading></span>
            <span data-amfm-error></span>
            <span data-amfm-zoom-in></span>
            <span data-amfm-zoom-out></span>
            <span data-amfm-fullscreen></span>
            <span data-amfm-zoom-level></span>
            <span data-amfm-tool-hint></span>
            <span data-amfm-advanced-tools></span>
            <span data-amfm-pin></span>
            <div data-amfm-diagram-popup>
                <span data-amfm-diagram-title></span>
                <span data-amfm-diagram-body></span>
                <span data-amfm-diagram-status></span>
                <span data-amfm-diagram-close></span>
            </div>
        </div>

        <!-- Légende -->
        <div class="amfm-legend" data-amfm-legend>
            <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; margin-bottom:6px;">
                <span data-amfm-legend-label>Échelle</span>
                <span data-amfm-legend-unit>°C</span>
            </div>
            <div data-amfm-legend-bar style="height:12px; border-radius:6px; background:linear-gradient(to right, #482173, #3478c5, #55b7dd, #70cf66, #f2d43d, #ea652b, #d93435, #5b1037);"></div>
        </div>

        <!-- Timeline Inférieure -->
        <footer class="amfm-timeline">
            <div class="amfm-player">
                <button type="button" data-amfm-previous title="Échéance précédente">◀</button>
                <button type="button" data-amfm-play title="Lancer l'animation">▶</button>
                <button type="button" data-amfm-next title="Échéance suivante">▶</button>
            </div>

            <div class="amfm-slider-track">
                <div class="amfm-info-row">
                    <span class="amfm-validity" data-amfm-validity>Chargement…</span>
                    <span class="amfm-lead" data-amfm-lead>H+00</span>
                </div>
                <input type="range" data-amfm-slider min="0" max="24" value="0" step="1">
            </div>
        </footer>
    </div>

    <!-- Script du Moteur Original -->
    <script src="js/arome-map.js?v=2.8.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const layerSelect = document.getElementById('direct-layer-select');
            if (layerSelect) {
                layerSelect.addEventListener('change', (e) => {
                    const event = new CustomEvent('layerchange', { detail: { layer: e.target.value } });
                    window.dispatchEvent(event);
                });
            }
        });
    </script>
</body>
</html>
