<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- SEO & Métadonnées Générales -->
    <title>Météo AROME HD 1,3 km & Multi-Modèles — Météo-Climat Pro</title>
    <meta name="description" content="Visualisation cartographique haute résolution des prévisions météo AROME HD (1,3 km) de Météo-France et multi-modèles (ARPEGE, ICON, GFS, ECMWF) : températures, rafales, pluie radar, orages MUCAPE et neige.">
    <meta name="author" content="Météo-Climat Pro">
    <meta name="theme-color" content="#070b14">
    <link rel="icon" type="image/png" href="https://alertes-meteo.com/assets/logo_meteo_climat_pro.png">

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp) -->
    <meta property="og:site_name" content="Météo-Climat Pro">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cartographie Haute Résolution AROME HD 1,3 km — Météo-Climat Pro">
    <meta property="og:description" content="Cartes météo 2D haute définition des modèles AROME HD, ARPEGE, ICON-EU, GFS et ECMWF en direct.">
    <meta property="og:image" content="https://alertes-meteo.com/assets/logo_meteo_climat_pro.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="fr_FR">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Météo AROME HD 1,3 km — Météo-Climat Pro">
    <meta name="twitter:description" content="Explorez les sorties du modèle météo AROME HD 1,3 km et des modèles mondiaux en ultra-haute résolution.">
    <meta name="twitter:image" content="https://alertes-meteo.com/assets/logo_meteo_climat_pro.png">

    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

    <style>
        :root {
            --amfm-bg: #070b14;
            --amfm-surface: rgba(13, 19, 33, 0.94);
            --amfm-border: rgba(255, 255, 255, 0.16);
            --amfm-border-focus: #00d2ff;
            --amfm-accent: #00d2ff;
            --amfm-accent-hover: #38bdf8;
            --amfm-text: #f8fafc;
            --amfm-muted: #94a3b8;
            --touch-target-min: 44px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--amfm-bg);
            color: var(--amfm-text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        [data-amfm-app] {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Viewport Cartographique Multi-Canvas */
        .amfm-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070b14;
            cursor: grab;
            touch-action: none;
            outline: none;
        }
        .amfm-viewport:active { cursor: grabbing; }

        .amfm-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Header Supérieur */
        .amfm-header {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            right: max(14px, env(safe-area-inset-right));
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            gap: 12px;
        }

        .amfm-card {
            pointer-events: auto;
            background: var(--amfm-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--amfm-border);
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: var(--touch-target-min);
        }

        .amfm-title {
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            white-space: nowrap;
        }

        .amfm-headline {
            font-size: 13px;
            font-weight: 700;
            color: var(--amfm-accent);
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
            white-space: nowrap;
        }
        .amfm-headline .amfm-headline-layer {
            color: var(--amfm-muted);
            font-weight: 600;
        }

        .amfm-badge {
            background: #00d2ff;
            color: #070b14 !important;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .amfm-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }

        select {
            background: rgba(8, 12, 20, 0.95);
            border: 1px solid var(--amfm-border);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            min-height: var(--touch-target-min);
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        select:hover, select:focus-visible {
            border-color: var(--amfm-border-focus);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        /* Boutons d'Action */
        .amfm-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--amfm-border);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            min-height: var(--touch-target-min);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .amfm-btn:hover, .amfm-btn:focus-visible {
            background: rgba(0, 210, 255, 0.25);
            border-color: var(--amfm-accent);
            outline: 2px solid var(--amfm-border-focus);
            outline-offset: 1px;
        }
        .amfm-btn:active { transform: scale(0.97); }

        .btn-download {
            background: linear-gradient(135deg, #0284c7, #0369a1) !important;
            color: #fff !important;
            font-weight: 800 !important;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .btn-download:hover {
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
            transform: translateY(-1px);
        }

        /* Légende Météorologique Compacte Pro avec Ticks */
        .amfm-legend {
            position: absolute;
            left: max(16px, env(safe-area-inset-left));
            bottom: 86px;
            z-index: 100;
            background: var(--amfm-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--amfm-border);
            border-radius: 10px;
            padding: 8px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 240px;
            pointer-events: none;
        }
        .amfm-legend-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #fff;
        }
        .amfm-legend-bar {
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #482173, #3478c5, #55b7dd, #70cf66, #f2d43d, #ea652b, #d93435, #5b1037);
        }
        .amfm-legend-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: var(--amfm-muted);
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        /* Timeline Inférieure */
        .amfm-timeline {
            position: absolute;
            bottom: max(14px, env(safe-area-inset-bottom));
            left: max(14px, env(safe-area-inset-left));
            right: max(14px, env(safe-area-inset-right));
            z-index: 100;
            background: var(--amfm-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--amfm-border);
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: var(--touch-target-min);
        }

        .amfm-player {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .amfm-player button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--amfm-border);
            color: #fff;
            width: var(--touch-target-min);
            height: var(--touch-target-min);
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .amfm-player button:hover, .amfm-player button:focus-visible {
            background: #0284c7;
            border-color: var(--amfm-accent);
            outline: 2px solid var(--amfm-border-focus);
            outline-offset: 2px;
        }
        .amfm-player button:active { transform: scale(0.94); }

        .amfm-slider-track {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .amfm-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 800;
        }
        .amfm-validity {
            color: var(--amfm-accent);
            font-variant-numeric: tabular-nums;
        }
        .amfm-lead {
            background: rgba(0, 210, 255, 0.18);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        /* Style Slider Universel Haute Définition (Chrome, Safari, iOS, Firefox, Edge) */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.18);
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--amfm-accent);
            box-shadow: 0 0 12px var(--amfm-accent), 0 2px 6px rgba(0,0,0,0.6);
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 18px #38bdf8, 0 3px 8px rgba(0,0,0,0.8);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--amfm-accent);
            box-shadow: 0 0 12px var(--amfm-accent);
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }
        input[type="range"]::-moz-range-track {
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.18);
        }

        /* Sonde de Pixel */
        .amfm-probe {
            position: fixed;
            z-index: 1500;
            pointer-events: none;
            background: rgba(8, 12, 20, 0.95);
            border: 1px solid var(--amfm-accent);
            border-radius: 8px;
            padding: 6px 12px;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }
        .amfm-probe.active { display: block; }
        .amfm-probe-pinned {
            display: flex !important;
            flex-direction: column;
            gap: 2px;
            position: absolute;
            z-index: 1500;
            pointer-events: auto;
            background: rgba(8, 12, 20, 0.96);
            border: 1px solid var(--amfm-accent);
            border-radius: 8px;
            padding: 6px 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }
        .amfm-probe-pin-close {
            position: absolute;
            top: 2px;
            right: 6px;
            background: none;
            border: none;
            color: var(--amfm-muted);
            font-size: 14px;
            cursor: pointer;
            padding: 2px 4px;
        }
        .amfm-probe-pin-close:hover { color: #fff; }
        .amfm-probe-val {
            font-size: 16px;
            font-weight: 800;
            color: var(--amfm-accent);
            font-variant-numeric: tabular-nums;
        }
        .amfm-probe-label { font-size: 11px; color: var(--amfm-muted); }

        /* 📱 RESPONSIVE MOBILE & TABLETTE (< 900px) */
        @media (max-width: 900px) {
            .amfm-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .amfm-card {
                justify-content: space-between;
                padding: 6px 10px;
            }
            .amfm-controls {
                flex-wrap: wrap;
                width: 100%;
                gap: 6px;
            }
            .amfm-controls select {
                flex: 1 1 calc(50% - 4px);
                min-width: 130px;
            }
            .amfm-controls .amfm-btn {
                flex: 1 1 calc(50% - 4px);
            }
            .amfm-legend {
                bottom: calc(max(14px, env(safe-area-inset-bottom)) + 76px);
                left: max(14px, env(safe-area-inset-left));
                right: max(14px, env(safe-area-inset-right));
                width: auto;
            }
            .amfm-timeline {
                gap: 12px;
                padding: 8px 14px;
            }
        }

        /* 📱 Mode Paysage Mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .amfm-card:first-child { display: none; }
            .amfm-legend { display: none; }
            .amfm-timeline {
                padding: 6px 14px;
                bottom: max(6px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div data-amfm-app
         data-base-url="output/arome"
         data-model="arome"
         data-logo="logo.png"
         data-variable="temperature"
         data-timezone="Europe/Paris"
         data-animation="1">
        
        <!-- Header Supérieur -->
        <header class="amfm-header" role="banner">
            <div class="amfm-card">
                <div class="amfm-title">
                    <img src="logo.png" alt="Météo-Climat Pro" style="height:24px;width:auto;" aria-hidden="false">
                    <span>MODÈLE AROME HD</span>
                    <span class="amfm-badge">1,3 km</span>
                </div>
                <div class="amfm-headline" data-amfm-headline aria-live="polite">Chargement…</div>
            </div>

            <div class="amfm-card amfm-controls" role="region" aria-label="Contrôles de la carte">
                <!-- Sélecteur de Modèle -->
                <select id="select-model" aria-label="Sélection du modèle de prévision">
                    <option value="arome" selected>🇫🇷 AROME HD (1,3 km)</option>
                </select>

                <!-- Lien Prévisions par commune -->
                <a href="previsions.html" class="amfm-btn" aria-label="Prévisions détaillées par commune ou code postal">
                    <i class="fa-solid fa-house-chimney" aria-hidden="true"></i> Commune
                </a>

                <!-- Sélecteur direct de Calque Météo 100% Opérationnel -->
                <select id="direct-layer-select" aria-label="Sélection du paramètre météorologique">
                    <optgroup label="🌡️ Températures">
                        <option value="temperature" selected>🌡️ Température à 2 m (°C)</option>
                        <option value="temperature_ressentie">❄️ Température ressentie (°C)</option>
                        <option value="point_rosee">💧 Point de rosée (°C)</option>
                        <option value="humidex">🔥 Indice Humidex</option>
                    </optgroup>
                    <optgroup label="🌧️ Précipitations & Pluie">
                        <option value="pluie_1h">🌧️ Pluie horaire (mm/h)</option>
                        <option value="pluie_cumul">📊 Précipitations cumulées (mm)</option>
                        <option value="reflectivite">📡 Réflectivité Radar Doppler (dBZ)</option>
                        <option value="graupel">🧊 Graupel / Grésil (mm)</option>
                    </optgroup>
                    <optgroup label="💨 Vent & Tempêtes">
                        <option value="vent">💨 Vent moyen à 10 m (km/h)</option>
                        <option value="rafales">⚡ Rafales maximales (km/h)</option>
                        <option value="rafales_cumul">🌪️ Rafales max cumulées (km/h)</option>
                    </optgroup>
                    <optgroup label="☁️ Nuages & Ciel">
                        <option value="nebulosite">☁️ Nébulosité totale (%)</option>
                        <option value="nuages_bas">🌫️ Nuages bas / Brouillard (%)</option>
                        <option value="nuages_moyens">⛅ Nuages moyens (%)</option>
                        <option value="nuages_eleves">🌤️ Nuages élevés / Voile (%)</option>
                        <option value="humidite">🌫️ Humidité relative (%)</option>
                    </optgroup>
                    <optgroup label="⛈️ Orages & Convection">
                        <option value="mucape">⚡ Instabilité convective (MUCAPE J/kg)</option>
                    </optgroup>
                    <optgroup label="❄️ Neige & Hiver">
                        <option value="neige">❄️ Chutes de neige (cm/h)</option>
                        <option value="neige_au_sol">🏔️ Épaisseur neige au sol (cm)</option>
                        <option value="equivalent_eau_neige">💧 Cumul neigeux équiv. eau (mm)</option>
                    </optgroup>
                    <optgroup label="🧭 Pression & Atmosphère">
                        <option value="pression">🧭 Pression niveau mer (hPa)</option>
                        <option value="pression_surface">⛰️ Pression au sol (hPa)</option>
                    </optgroup>
                </select>

                <!-- Sélecteur de Région -->
                <select id="select-region" data-amfm-region-select aria-label="Zoomer sur une région de France">
                    <option value="france">🇫🇷 France Entière</option>
                    <option value="hdf">🏘️ Hauts-de-France</option>
                    <option value="normandie">🍏 Normandie</option>
                    <option value="idf">🗼 Île-de-France</option>
                    <option value="grandest">🥨 Grand Est</option>
                    <option value="bretagne">⛵ Bretagne</option>
                    <option value="pdl">⚓ Pays de la Loire</option>
                    <option value="cvl">🏰 Centre-Val de Loire</option>
                    <option value="bfc">🍇 Bourgogne-Franche-Comté</option>
                    <option value="naq">🌊 Nouvelle-Aquitaine</option>
                    <option value="ara">⛰️ Auvergne-Rhône-Alpes</option>
                    <option value="occitanie">🌞 Occitanie</option>
                    <option value="paca">☀️ PACA</option>
                    <option value="corse">🏝️ Corse</option>
                    <option value="belgique">🇧🇪 Belgique</option>
                </select>

                <!-- Boutons Télécharger Carte (PNG / JPEG / GIF animé) -->
                <button type="button" class="amfm-btn btn-download" data-amfm-capture aria-label="Télécharger la carte en PNG haute définition">
                    <i class="fa-solid fa-download" aria-hidden="true"></i> PNG
                </button>
                <button type="button" class="amfm-btn btn-download" data-amfm-capture-jpeg aria-label="Télécharger la carte en JPEG">
                    <i class="fa-solid fa-image" aria-hidden="true"></i> JPEG
                </button>
                <button type="button" class="amfm-btn btn-download" data-amfm-capture-gif aria-label="Télécharger l'animation en GIF animé">
                    <i class="fa-solid fa-film" aria-hidden="true"></i> GIF
                </button>

                <!-- Recadrer -->
                <button type="button" class="amfm-btn" data-amfm-reset aria-label="Recentrer la carte météo">
                    <i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>
                </button>
            </div>
        </header>

        <!-- Viewport Cartographique Multi-Canvas -->
        <main class="amfm-viewport" data-amfm-viewport tabindex="0" role="main" aria-label="Carte interactive de prévisions météo AROME HD (Touches +/- pour zoomer, flèches pour naviguer)">
            <canvas class="amfm-canvas" data-amfm-weather aria-hidden="true"></canvas>
            <canvas class="amfm-canvas" data-amfm-vectors aria-hidden="true"></canvas>
            <canvas class="amfm-canvas" data-amfm-labels aria-hidden="true"></canvas>
        </main>

        <!-- Sonde de Pixel -->
        <div class="amfm-probe" data-amfm-probe role="status">
            <div class="amfm-probe-val" data-amfm-probe-value>—</div>
            <div class="amfm-probe-label" data-amfm-probe-label>Température</div>
        </div>

        <!-- Légende Dynamique avec Ticks -->
        <aside class="amfm-legend" data-amfm-legend role="complementary" aria-label="Échelle colorimétrique de la carte">
            <div class="amfm-legend-header">
                <span data-amfm-legend-label>Échelle</span>
                <span data-amfm-legend-unit>°C</span>
            </div>
            <div class="amfm-legend-bar" data-amfm-legend-bar></div>
            <div class="amfm-legend-ticks" data-amfm-legend-ticks>
                <span>-15°</span><span>0°</span><span>15°</span><span>30°</span><span>45°</span>
            </div>
        </aside>

        <!-- Timeline Inférieure -->
        <footer class="amfm-timeline" role="region" aria-label="Contrôle de la timeline et des échéances de prévision">
            <div class="amfm-player">
                <button type="button" data-amfm-previous aria-label="Échéance horaire précédente">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button type="button" data-amfm-play aria-label="Lancer la lecture automatique de l'animation">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button type="button" data-amfm-next aria-label="Échéance horaire suivante">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <div class="amfm-slider-track">
                <div class="amfm-info-row">
                    <span class="amfm-validity" data-amfm-validity aria-live="polite">Chargement…</span>
                    <span class="amfm-lead" data-amfm-lead>H+00</span>
                </div>
