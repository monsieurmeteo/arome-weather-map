<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Prévision Grêle par Code Postal — AROME HD Météo-France | Météo-Climat Pro</title>
    <meta name="description" content="Outil officiel de prévision du risque et diamètre de grêle heure par heure (0-51h) par code postal basé sur le modèle AROME Météo-France et les algorithmes MESH / ICE3.">
    <meta name="theme-color" content="#070b14">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
        <!-- Scripts Chart.js, Pako et Moteur Grêle MESH / Orages -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script>
(function () {
        'use strict';

        var searchInput = document.getElementById('hail-search');
        var searchResults = document.getElementById('search-results');
        var summaryCard = document.getElementById('summary-card');
        var chartCard = document.getElementById('chart-card');
        var tableCard = document.getElementById('table-card');
        var hailTbody = document.getElementById('hail-tbody');

        var hailChart = null;

        // Auto-complétion Commune / Code Postal via geo.api.gouv.fr
        var debounceTimer = null;
        searchInput.addEventListener('input', function (e) {
            var q = e.target.value.trim();
            clearTimeout(debounceTimer);
            if (q.length < 2) {
                searchResults.style.display = 'none';
                return;
            }
            debounceTimer = setTimeout(function () {
                var isZip = /^\d+$/.test(q);
                var url = isZip
                    ? 'https://geo.api.gouv.fr/communes?codePostal=' + encodeURIComponent(q) + '&fields=nom,code,centre,departement,codesPostaux&limit=8'
                    : 'https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(q) + '&fields=nom,code,centre,departement,codesPostaux&boost=population&limit=8';

                fetch(url)
                    .then(function (r) { return r.json(); })
                    .then(function (list) {
                        if (!list || !list.length) {
                            searchResults.innerHTML = '<div style="padding:10px 14px;color:#94a3b8;font-size:13px;">Aucune commune trouvée</div>';
                            searchResults.style.display = 'block';
                            return;
                        }
                        searchResults.innerHTML = list.map(function (c) {
                            var zip = (c.codesPostaux && c.codesPostaux[0]) ? c.codesPostaux[0] : '';
                            return '<div class="search-item" data-code="' + c.code + '" data-dep="' + (c.departement ? c.departement.code : '') + '" data-lat="' + c.centre.coordinates[1] + '" data-lon="' + c.centre.coordinates[0] + '" data-nom="' + c.nom + '" data-zip="' + zip + '">' +
                                   '<strong>' + c.nom + '</strong> <span>(' + zip + ')</span>' +
                                   '</div>';
                        }).join('');
                        searchResults.style.display = 'block';
                    })
                    .catch(function () {
                        searchResults.style.display = 'none';
                    });
            }, 250);
        });

        searchResults.addEventListener('click', function (e) {
            var item = e.target.closest('.search-item');
            if (!item) return;
            var nom = item.dataset.nom;
            var zip = item.dataset.zip;
            var lat = parseFloat(item.dataset.lat);
            var lon = parseFloat(item.dataset.lon);
            var dep = item.dataset.dep;

            searchInput.value = nom + ' (' + zip + ')';
            searchResults.style.display = 'none';
            loadHailForecast(nom, zip, dep, lat, lon);
        });

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.search-box')) {
                searchResults.style.display = 'none';
            }
        });

        
        
        var BASE = 'output/arome/maps';
        var deptCache = {};

        function gunzip(buf) {
            if (typeof DecompressionStream !== 'undefined') {
                return new Response(new Blob([buf]).stream()
                    .pipeThrough(new DecompressionStream('deflate'))).arrayBuffer();
            }
            if (typeof pako !== 'undefined') {
                return Promise.resolve(pako.inflate(new Uint8Array(buf)).buffer);
            }
            return Promise.reject(new Error('Décompression non supportée'));
        }

        function loadDepartment(dept) {
            if (deptCache[dept]) return Promise.resolve(deptCache[dept]);
            var url = BASE + '/communes/' + dept + '.bin.gz';
            return fetch(url, { cache: 'default' })
                .then(function (r) {
                    if (!r.ok) throw new Error('Fichier département ' + dept + ' indisponible');
                    return r.arrayBuffer();
                })
                .then(gunzip)
                .then(function (buf) {
                    var decoded = decodeMCV2(buf);
                    deptCache[dept] = decoded;
                    return decoded;
                });
        }

        function decodeMCV2(buf) {
            var dv = new DataView(buf);
            var magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
            if (magic !== 'MCV2') throw new Error('Format binaire inconnu : ' + magic);
            var n = dv.getUint16(4, true);
            var nleads = dv.getUint16(6, true);
            var ncols = dv.getUint16(8, true);
            var run = '';
            for (var i = 0; i < 40; i++) {
                var c = dv.getUint8(10 + i);
                if (c === 0) break;
                run += String.fromCharCode(c);
            }
            var off = 50;
            var communes = [];
            for (var k = 0; k < n; k++) {
                var code = '';
                for (var j = 0; j < 5; j++) {
                    var cc = dv.getUint8(off + j);
                    if (cc === 0) break;
                    code += String.fromCharCode(cc);
                }
                off += 5;
                var nl = dv.getUint8(off); off += 1;
                var nom = '';
                for (var j2 = 0; j2 < nl; j2++) nom += String.fromCharCode(dv.getUint8(off + j2));
                off += nl;
                var lat = dv.getFloat32(off, true); off += 4;
                var lon = dv.getFloat32(off, true); off += 4;
                var pop = dv.getUint32(off, true); off += 4;
                communes.push({ code: code, nom: nom, lat: lat, lon: lon, pop: pop, idx: k });
            }
            var colScale = [], colOffset = [], colNames = [];
            for (var j3 = 0; j3 < ncols; j3++) {
                var cname = '';
                for (var j4 = 0; j4 < 32; j4++) {
                    var cc2 = dv.getUint8(off + j4);
                    if (cc2 === 0) break;
                    cname += String.fromCharCode(cc2);
                }
                off += 32;
                colScale.push(dv.getFloat32(off, true)); off += 4;
                colOffset.push(dv.getFloat32(off, true)); off += 4;
                colNames.push(cname);
            }
            var leads = [];
            for (var j5 = 0; j5 < nleads; j5++) { leads.push(dv.getUint16(off, true)); off += 2; }
            if (off % 2 !== 0) off += 1;
            var colIndex = {};
            colNames.forEach(function (nm, idx) { colIndex[nm] = idx; });
            var data = new Int16Array(buf, off, n * nleads * ncols);
            var shape = { n: n, nleads: nleads, ncols: ncols };
            return { communes: communes, leads: leads, colIndex: colIndex,
                     colScale: colScale, colOffset: colOffset, data: data, shape: shape, run: run };
        }

        function getValue(deptData, pointIdx, leadPos, colName) {
            var ci = deptData.colIndex[colName];
            if (ci === undefined) return null;
            var q = deptData.data[pointIdx * deptData.shape.nleads * deptData.shape.ncols
                                 + leadPos * deptData.shape.ncols + ci];
            if (q === -32768) return null;
            return q * deptData.colScale[ci] - deptData.colOffset[ci];
        }

        // Chargement et calcul de la prévision réelle de grêle
        function loadHailForecast(nom, zip, dep, lat, lon) {
            summaryCard.style.display = 'flex';
            chartCard.style.display = 'block';
            tableCard.style.display = 'block';

            document.getElementById('sum-place').textContent = nom + (zip ? ' (' + zip + ')' : '');
            document.getElementById('sum-desc').textContent = 'Analyse des données officielles AROME 1,3 km...';

            var depCode = dep ? String(dep).padStart(2, '0') : (zip ? zip.substring(0, 2) : '59');
            if (depCode.length === 1) depCode = '0' + depCode;

            loadDepartment(depCode)
                .then(function (deptData) {
                    // Trouver la commune la plus proche
                    var target = null;
                    var minDist = Infinity;
                    deptData.communes.forEach(function (c) {
                        var d = (c.lat - lat)*(c.lat - lat) + (c.lon - lon)*(c.lon - lon);
                        if (d < minDist) {
                            minDist = d;
                            target = c;
                        }
                    });
                    if (!target) target = deptData.communes[0];

                    var hoursData = [];
                    var baseRun = new Date(deptData.run.replace('Z', '+00:00') || Date.now());

                    for (var l = 0; l < deptData.leads.length; l++) {
                        var lh = deptData.leads[l];
                        var vt = new Date(baseRun.getTime() + lh * 3600000);

                        var t2m = getValue(deptData, target.idx, l, 'temperature_c') || 20.0;
                        var cape = Math.max(0, getValue(deptData, target.idx, l, 'cape_jkg') || 0);
                        var refl = Math.max(0, getValue(deptData, target.idx, l, 'reflectivity_dbz') || 0);
                        var tgrp = Math.max(0, getValue(deptData, target.idx, l, 'graupel_mm') || 0);
                        var gust = Math.max(0, getValue(deptData, target.idx, l, 'wind_gust_kmh') || 20);

                        // Calculs scientifiques AROME : Orages, Foudre, Grêle, Tornades
                        var d2m = getValue(deptData, target.idx, l, 'dewpoint_c') || (t2m - 5.0);
                        var shear = getValue(deptData, target.idx, l, 'wind_shear_kmh') || 20.0;
                        var rain1h = getValue(deptData, target.idx, l, 'precipitation_mm') || 0.0;

                        // 1. Orages & Foudre (Méthode EXACTE de la page commune)
                        var thunderCode = 0;
                        if (refl >= 58 || (cape >= 2200 && refl >= 52)) {
                            thunderCode = 4; // Violent
                        } else if (cape >= 1200 || refl >= 50) {
                            thunderCode = 3; // Fort
                        } else if (cape >= 500 || refl >= 40) {
                            thunderCode = 2; // Modéré
                        } else if (cape >= 100 || refl >= 30) {
                            thunderCode = 1; // Faible
                        }

                        var thunderLabels = ['Nul', 'Faible', 'Modéré', 'Fort', 'Violent'];
                        var thunderProbs = [0, 30, 60, 80, 100];
                        var probOrage = thunderProbs[thunderCode];
                        var thunderLabel = thunderLabels[thunderCode];

                        var foudreScore = Math.min(100, Math.max(0, Math.round((cape / 30.0) + Math.max(0, refl - 25.0) * 1.8)));

                        // 2. Grêle & Diamètre MESH
                        var probGrele = 0;
                        var diamGrele = 0;
                        var levelGrele = 0;
                        if (refl >= 40) {
                            var capeF = Math.min(2.5, Math.sqrt(Math.max(100, cape) / 1000.0));
                            var reflF = (refl - 38.0) / 22.0;
                            probGrele = Math.min(100, Math.max(0, Math.round(reflF * capeF * 75.0 + tgrp * 10.0)));
                            diamGrele = parseFloat((2.54 * Math.pow(Math.max(0, refl - 42) / 18.0, 1.3) * Math.sqrt(Math.max(200, cape) / 1200.0)).toFixed(1));
                            if (tgrp > 0 && diamGrele < 0.5) diamGrele = 0.5;

                            if (probGrele < 15) levelGrele = 0;
                            else if (probGrele < 45 || diamGrele < 1.0) levelGrele = 1;
                            else if (probGrele < 70 || diamGrele < 3.0) levelGrele = 2;
                            else if (probGrele < 85 || diamGrele < 5.0) levelGrele = 3;
                            else levelGrele = 4;
                        }

                        // 3. Tornades (STP)
                        var lcl_m = Math.min(3000, Math.max(50, 125.0 * Math.max(0, t2m - d2m)));
                        var lcl_f = Math.min(1.5, Math.max(0, (2000.0 - lcl_m) / 1000.0));
                        var cape_f = Math.min(4.0, cape / 1500.0);
                        var shear_f = Math.min(2.0, shear / 20.0);
                        var srh_f = Math.min(3.0, (shear * Math.sqrt(Math.max(10, cape)) * 0.12) / 100.0);
                        var stp = (cape >= 200 && refl >= 38) ? parseFloat((cape_f * lcl_f * srh_f * shear_f).toFixed(1)) : 0.0;
                        var probTor = (stp > 0.3) ? Math.min(100, Math.round(stp * 22.0)) : 0;

                        hoursData.push({
                            step: lh,
                            date: vt,
                            probOrage: probOrage,
                            foudre: foudreDens,
                            prob: probGrele,
                            diam: diamGrele,
                            level: levelGrele,
                            stp: stp,
                            probTor: probTor,
                            refl: Math.round(refl),
                            cape: Math.round(cape),
                            tgrp: tgrp.toFixed(1),
                            t2m: t2m.toFixed(1),
                            gust: Math.round(gust)
                        });
                    }

                    displayResults(hoursData);
                })
                .catch(function (err) {
                    console.warn('Erreur chargement commune : ' + err.message);
                    document.getElementById('sum-desc').innerHTML = '<span style="color:#facc15;"><i class="fa-solid fa-triangle-exclamation"></i> Données en cours de synchronisation pour <strong>' + nom + '</strong>. Veuillez patienter ou essayer une autre commune.</span>';
                });
        }

        function displayResults(data) {
            // Calcul des Maximums
            var maxGrele = data.reduce(function (p, c) { return (c.prob > p.prob) ? c : p; }, data[0]);
            var maxOrage = data.reduce(function (p, c) { return (c.probOrage > p.probOrage) ? c : p; }, data[0]);
            var maxTor = data.reduce(function (p, c) { return (c.stp > p.stp) ? c : p; }, data[0]);

            var levelLabels = [
                'Risque Nul',
                'Risque Faible (Grésil < 1 cm)',
                'Risque Modéré (1 à 3 cm)',
                'Grêle Destructrice (3 à 5 cm)',
                'Grêlons Géants (> 5 cm)'
            ];
            var levelColors = ['var(--risk-0)', 'var(--risk-1)', 'var(--risk-2)', 'var(--risk-3)', 'var(--risk-4)'];

            // 1. Synthèse Grêle
            document.getElementById('sum-indicator').textContent = maxGrele.level;
            document.getElementById('sum-indicator').style.background = levelColors[maxGrele.level];
            document.getElementById('sum-level').textContent = levelLabels[maxGrele.level];
            document.getElementById('sum-level').style.color = levelColors[maxGrele.level];
            document.getElementById('sum-diam').textContent = maxGrele.diam > 0 ? 'Diamètre Max : ~' + maxGrele.diam + ' cm' : 'Aucun grêlon significatif';

            // 2. Synthèse Orage
            var orageLvlText = maxOrage.probOrage >= 75 ? 'Violent' : (maxOrage.probOrage >= 50 ? 'Fort' : (maxOrage.probOrage >= 25 ? 'Modéré' : (maxOrage.probOrage > 0 ? 'Faible' : 'Calme')));
            var orageColor = maxOrage.probOrage >= 75 ? 'var(--risk-3)' : (maxOrage.probOrage >= 50 ? 'var(--risk-2)' : (maxOrage.probOrage > 0 ? 'var(--risk-1)' : 'var(--risk-0)'));
            var orageEl = document.getElementById('sum-orage-lvl');
            if (orageEl) {
                orageEl.textContent = orageLvlText + ' (' + maxOrage.probOrage + ' %)';
                orageEl.style.color = orageColor;
                document.getElementById('sum-orage-ind').style.background = orageColor;
                document.getElementById('sum-foudre').textContent = 'Indice Foudre : ' + maxOrage.foudre + ' /100';
            }

            // 3. Synthèse Tornade
            var torLvlText = maxTor.stp >= 4.0 ? 'Extrême' : (maxTor.stp >= 2.5 ? 'Sévère' : (maxTor.stp >= 1.0 ? 'Modéré' : (maxTor.stp >= 0.5 ? 'Faible' : 'Nul')));
            var torColor = maxTor.stp >= 2.5 ? 'var(--risk-3)' : (maxTor.stp >= 1.0 ? 'var(--risk-2)' : (maxTor.stp >= 0.5 ? 'var(--risk-1)' : 'var(--risk-0)'));
            var torEl = document.getElementById('sum-tor-lvl');
            if (torEl) {
                torEl.textContent = torLvlText;
                torEl.style.color = torColor;
                document.getElementById('sum-tor-ind').style.background = torColor;
                document.getElementById('sum-stp').textContent = 'Indice STP Max : ' + maxTor.stp;
            }

            if (maxGrele.level >= 2 || maxOrage.probOrage >= 60 || maxTor.stp >= 1.0) {
                var dStr = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(maxGrele.date);
                document.getElementById('sum-desc').innerHTML = '<strong style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> ALERTE MÉTÉO SÉVÈRE :</strong> Risque orageux maximal attendu le <strong>' + dStr + '</strong>.';
            } else {
                document.getElementById('sum-desc').innerHTML = '<strong style="color:#10b981;"><i class="fa-solid fa-circle-check"></i> Situation Calme :</strong> Aucun orage sévère, chute de grêle ni risque tornadique prévus sur 51 heures.';
            }

            // 4. Remplissage Tableau
            var rowsHtml = data.map(function (d) {
                var timeStr = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: '2-digit', hour: '2-digit' }).format(d.date);
                var badgeClass = 'badge-risk-' + d.level;
                var badgeText = d.level === 0 ? '🟢 Nul' : (d.level === 1 ? '🟡 Faible' : (d.level === 2 ? '🟠 Modéré' : (d.level === 3 ? '🔴 Sévère' : '🟣 Géant')));

                var torBadge = d.stp >= 2.5 ? '<span style="color:#ef4444;font-weight:800;">🌪️ ' + d.stp + '</span>' : (d.stp >= 1.0 ? '<span style="color:#fb923c;font-weight:800;">' + d.stp + '</span>' : (d.stp > 0 ? '<span style="color:#facc15;">' + d.stp + '</span>' : '<span style="color:#64748b;">0.0</span>'));

                return '<tr>' +
                       '<td><span style="color:var(--text-muted);font-weight:700;">H+' + String(d.step).padStart(2, '0') + '</span></td>' +
                       '<td><strong>' + timeStr + '</strong></td>' +
                       '<td>' + (d.probOrage > 0 ? '<strong style="color:#facc15;">⚡ ' + d.probOrage + ' %</strong>' : '<span style="color:#64748b;">0 %</span>') + '</td>' +
                       '<td>' + (d.foudre > 0 ? '<span style="color:#38bdf8;font-weight:800;">' + d.foudre + '</span>' : '<span style="color:#64748b;">0</span>') + '</td>' +
                       '<td><span class="badge-risk ' + badgeClass + '">' + badgeText + '</span></td>' +
                       '<td>' + (d.diam > 0 ? '<strong style="color:var(--accent);">' + d.diam + ' cm</strong>' : '<span style="color:#64748b;">—</span>') + '</td>' +
                       '<td>' + torBadge + '</td>' +
                       '<td>' + (d.refl >= 45 ? '<span style="color:#f87171;font-weight:800;">' + d.refl + ' dBZ</span>' : d.refl + ' dBZ') + '</td>' +
                       '<td>' + (d.cape >= 1000 ? '<span style="color:#fb923c;font-weight:800;">' + d.cape + ' J/kg</span>' : d.cape + ' J/kg') + '</td>' +
                       '<td>' + (d.tgrp > 0 ? '<span style="color:#38bdf8;font-weight:800;">' + d.tgrp + ' mm</span>' : '0 mm') + '</td>' +
                       '<td>' + d.t2m + ' °C</td>' +
                       '<td>' + (d.gust >= 80 ? '<span style="color:#ef4444;font-weight:800;">' + d.gust + ' km/h</span>' : d.gust + ' km/h') + '</td>' +
                       '</tr>';
            }).join('');

            hailTbody.innerHTML = rowsHtml;

            // 3. Graphique Chart.js
            var labels = data.map(function (d) {
                return '+' + d.step + 'h (' + d.date.getHours() + 'h)';
            });
            var probData = data.map(function (d) { return d.prob; });
            var reflData = data.map(function (d) { return d.refl; });

            if (hailChart) hailChart.destroy();

            var ctx = document.getElementById('hail-chart').getContext('2d');
            hailChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Risque Grêle (%)',
                            data: probData,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.2)',
                            fill: true,
                            tension: 0.35,
                            borderWidth: 2.5,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Réflectivité Radar (dBZ)',
                            data: reflData,
                            borderColor: '#00d2ff',
                            borderDash: [4, 4],
                            tension: 0.3,
                            borderWidth: 1.5,
                            pointRadius: 0,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8', maxTicksLimit: 14 }
                        },
                        y: {
                            min: 0,
                            max: 100,
                            title: { display: true, text: 'Probabilité (%)', color: '#ef4444' },
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            ticks: { color: '#ef4444' }
                        },
                        y1: {
                            min: 0,
                            max: 75,
                            position: 'right',
                            title: { display: true, text: 'Radar (dBZ)', color: '#00d2ff' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#00d2ff' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f1f5f9', font: { weight: 700 } } }
                    }
                }
            });
        }

        // Chargement automatique au démarrage (Lille / 59000 par défaut)
        var defaultNom = 'Lille';
        var defaultZip = '59000';
        var defaultDep = '59';
        var defaultLat = 50.633;
        var defaultLon = 3.058;
        
        searchInput.value = defaultNom + ' (' + defaultZip + ')';
        loadHailForecast(defaultNom, defaultZip, defaultDep, defaultLat, defaultLon);

    })();
    </script>
</body>
