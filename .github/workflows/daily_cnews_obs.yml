name: Actualisation Prévisions - Site Web Météo-France

on:
  schedule:
    # Trois fois par jour à 5h45, 11h45 et 17h45 UTC (soit Matin, Midi et Soir en France)
    - cron: '45 5,11,17 * * *'
  workflow_dispatch: # Permet de lancer la génération manuellement depuis GitHub

jobs:
  generate-and-publish:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v3

      - name: Configurer Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Étape 1 - Générer les données de prévisions Météo-France (JSON & CSV)
        run: |
          # Générer les données de prévisions nationales (16 jours par défaut en json-only)
          python "generate_meteofrance_maps.py" --zone france_pictos --json-only

          # Liste des zones régionales
          $zones = @("hdf", "normandie", "idf", "grandest", "ara", "naq", "occitanie", "paca", "bfc", "bretagne", "pdl", "cvl", "corse")
          foreach ($zone in $zones) {
              python "generate_meteofrance_maps.py" --zone $zone --json-only
          }

      - name: Étape 2 - Enregistrer et pousser les prévisions, CSV et token sur GitHub
        run: |
          git config --global user.name "Météo Automatique"
          git config --global user.email "meteo-bot@cnews.fr"
          git add meteofrance_data*.json meteofrance_*.csv meteofrance_token.json
          git commit -m "Mise à jour automatique des prévisions Météo-France, CSV et token"
          git push origin main
