name: "Mise a Jour Automatique Multi-Modeles Meteo (24/7)"

on:
  schedule:
    # Toutes les 3h — met à jour les 5 modèles (runs 00z/06z/12z/18z)
    - cron: '15 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "weather-pipeline"
  cancel-in-progress: false

jobs:
  update-weather-models:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      METEOFRANCE_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances systeme et Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes cfgrib xarray scipy ecmwf-opendata

      - name: Verification du token AROME
        run: |
          if [ -z "$METEOFRANCE_TOKEN" ]; then
            echo "WARNING: METEOFRANCE_TOKEN non configure — AROME sera saute"
          else
            echo "Token AROME present (${#METEOFRANCE_TOKEN} caracteres)"
          fi

      - name: Execution du Pipeline Multi-Modeles
        run: |
          # Pour l'instant : uniquement AROME (rapide via WMS).
          # Les autres modèles (ARPEGE, ICON, GFS, ECMWF) seront réactivés plus tard.
          python pipeline/fetch_and_render_all.py --model arome

      - name: Commit et Push des nouvelles cartes
        run: |
          git config --global user.name "Meteo Automations Bot"
          git config --global user.email "bot@meteo-climat.pro"
          git add output/
          if git diff --staged --quiet; then
            echo "Aucune nouvelle carte a pousser."
          else
            git commit -m "Mise a jour automatique des modeles meteo [$(date -u +'%Y-%m-%d %H:%MZ')]"
          fi
          # Fusionner avec le remote en gardant NOS artefacts regeneres
          # (evite les conflits binaires sur output/*.webp)
          git fetch origin main
          git merge origin/main -X ours --no-edit || {
            git checkout --ours -- output/ 2>/dev/null || true
            git add output/
            git commit --no-edit || true
          }
          git push origin main
          # (Le déploiement est géré par le workflow deploy-pages.yml,
          #  déclenché automatiquement par ce push.)
