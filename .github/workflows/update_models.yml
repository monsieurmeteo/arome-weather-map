name: "Mise à Jour Automatique Multi-Modèles Météo (24/7)"

on:
  schedule:
    # Exécution automatique toutes les 3 heures (00z, 03z, 06z, 09z, 12z, 15z, 18z, 21z)
    - cron: '15 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "weather-pipeline"
  cancel-in-progress: false

jobs:
  update-weather-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances météorologiques
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes cfgrib xarray scipy

      - name: ⚡ Exécution du Pipeline Multi-Modèles (AROME, ARPEGE, ICON, GFS, ECMWF)
        run: |
          python pipeline/fetch_and_render_all.py --model all

      - name: 💾 Commit & Push des nouvelles cartes
        run: |
          git config --global user.name "Météo Automations Bot"
          git config --global user.email "bot@meteo-climat.pro"
          git add output/
          if git diff --staged --quiet; then
            echo "Aucune nouvelle carte à pousser."
          else
            git commit -m "⚡ Mise à jour automatique des modèles météo [$(date -u +'%Y-%m-%d %H:%MZ')]"
            git push origin main
          fi

      - name: 🚀 Déploiement sur GitHub Pages
        uses: actions/deploy-pages@v4
        if: success()
