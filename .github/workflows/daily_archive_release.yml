name: "Archivage Quotidien Automatique des Cartes (GitHub Releases)"

on:
  schedule:
    # Tous les soirs à 23h55 UTC (01h55 heure de Paris) après le dernier run
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-daily-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation Pillow
        run: pip install pillow

      - name: Generation de l'archive structuree (France + 13 Regions + 30 Parametres)
        id: package
        run: |
          DATE_STR=$(date -u +'%Y-%m-%d')
          MONTH_TAG="archives-$(date -u +'%Y-%m')"
          ZIP_NAME="arome_cartes_${DATE_STR}.zip"
          
          echo "DATE_STR=${DATE_STR}" >> $GITHUB_ENV
          echo "MONTH_TAG=${MONTH_TAG}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          python pipeline/package_archive.py

      - name: Publication dans GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Creer la release mensuelle si elle n'existe pas
          if ! gh release view "${MONTH_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Creation de la release mensuelle ${MONTH_TAG}..."
            gh release create "${MONTH_TAG}"               --repo "${{ github.repository }}"               --title "Archives Cartes AROME — $(date -u +'%B %Y')"               --notes "Archives quotidiennes automatiques et structurees (France entiere + 13 Regions francaises + 30 parametres complets)."
          fi

          # 2. Uploader l'archive du jour dans la release mensuelle
          echo "Upload de ${ZIP_NAME} dans ${MONTH_TAG}..."
          gh release upload "${MONTH_TAG}" "${ZIP_NAME}" --repo "${{ github.repository }}" --clobber
          echo "Archive ${ZIP_NAME} publiee avec succes !"
