name: Foudre Archive Hourly

on:
  schedule:
    # Toutes les heures à H:05 UTC
    - cron: '5 * * * *'
  workflow_dispatch: # Lancement manuel possible

jobs:
  archive-foudre:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Pas de cache npm — le script n'utilise que des modules natifs (fs, path, fetch)

      - name: Sync Lightning Data directly to Git JSON files
        env:
          CRON_MODE: "1"
        run: node scripts/sync_foudre_static.mjs

      - name: Commit and push JSON archives to Git repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/archives_orage/
          # Commit seulement s'il y a des modifications
          if git diff --staged --quiet; then
            echo "⚫ Aucun nouvel impact à archiver."
          else
            echo "📝 Nouveaux impacts détectés. Commit et push..."
            git commit -m "chore(foudre): archivage automatique statique foudre [skip ci] [skip vercel]"
            git pull --rebase origin master
            git push origin master
          fi
